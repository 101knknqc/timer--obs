name: Build & Package — Confidence Monitor

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Qt6 ────────────────────────────────────────────────
      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtmultimedia
          cache: true

      # ── 3. Download OBS Studio 32.1.0 (zip portable) ──────────
      - name: Download OBS Studio
        shell: pwsh
        run: |
          $OBS_VERSION = "32.1.0"
          $url = "https://github.com/obsproject/obs-studio/releases/download/$OBS_VERSION/OBS-Studio-$OBS_VERSION-Windows-x64.zip"
          Write-Host "Downloading OBS $OBS_VERSION from: $url"
          Invoke-WebRequest $url -OutFile obs-studio.zip -UseBasicParsing
          Expand-Archive obs-studio.zip -DestinationPath obs-studio-pkg
          Write-Host "=== Top-level contents ==="
          Get-ChildItem obs-studio-pkg | Select-Object Name

      # ── 4. Clone OBS source for headers ───────────────────────
      - name: Clone OBS source (headers only)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 32.1.0 `
            https://github.com/obsproject/obs-studio.git obs-source
          Write-Host "Headers available at obs-source/"

      # ── 5. Find .lib files ────────────────────────────────────
      - name: Locate OBS import libs
        shell: pwsh
        run: |
          Write-Host "=== Searching for .lib files ==="
          $libs = Get-ChildItem -Recurse obs-studio-pkg -Filter "*.lib"
          $libs | Select-Object FullName

          $obsLib = $libs | Where-Object { $_.Name -eq "obs.lib" }    | Select-Object -First 1
          $feLib  = $libs | Where-Object { $_.Name -eq "obs-frontend-api.lib" } | Select-Object -First 1

          if (-not $obsLib) {
            Write-Host "obs.lib not found — listing ALL files in package:"
            Get-ChildItem -Recurse obs-studio-pkg | Select-Object FullName
            throw "obs.lib not found in OBS package!"
          }
          if (-not $feLib) {
            throw "obs-frontend-api.lib not found in OBS package!"
          }

          Write-Host "obs.lib      → $($obsLib.FullName)"
          Write-Host "frontend.lib → $($feLib.FullName)"

          echo "OBS_LIB_DIR=$($obsLib.DirectoryName)"   >> $env:GITHUB_ENV
          echo "OBS_FE_LIB_DIR=$($feLib.DirectoryName)" >> $env:GITHUB_ENV

      # ── 6. Configure CMake ────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DQt6_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DOBS_SOURCE_DIR="${{ github.workspace }}/obs-source" `
            -DOBS_LIB_DIR="${{ env.OBS_LIB_DIR }}" `
            -DOBS_FE_LIB_DIR="${{ env.OBS_FE_LIB_DIR }}"

      # ── 7. Build ──────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release

      # ── 8. Stage files ────────────────────────────────────────
      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/bin/64bit
          New-Item -ItemType Directory -Force -Path staging/data/locale

          Copy-Item build/Release/confidence-monitor.dll staging/bin/64bit/
          Copy-Item data/locale/en-US.ini                staging/data/locale/
          Copy-Item data/alert.wav                        staging/data/
          Copy-Item LICENSE.txt                           staging/

          # Remove icon lines from NSIS (no icon.ico in repo)
          $nsi = Get-Content installer.nsi
          $nsi = $nsi -replace '!define MUI_ICON.*',                    ''
          $nsi = $nsi -replace '!define MUI_UNICON.*',                  ''
          $nsi = $nsi -replace '!define MUI_HEADERIMAGE_BITMAP.*',      ''
          $nsi = $nsi -replace '!define MUI_WELCOMEFINISHPAGE_BITMAP.*',''
          $nsi | Set-Content staging/installer.nsi

      # ── 9. Build installer ────────────────────────────────────
      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: staging
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          Move-Item confidence-monitor-setup.exe ../

      # ── 10. Upload artifact ───────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: confidence-monitor-setup
          path: confidence-monitor-setup.exe
          retention-days: 30

      # ── 11. GitHub Release (sur tag v*) ───────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: confidence-monitor-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
