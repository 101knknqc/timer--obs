name: Build & Package — Confidence Monitor

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
    # ── Checkout ─────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── Qt6 ──────────────────────────────────────────────────
    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version:   '6.6.0'
        host:      'windows'
        target:    'desktop'
        arch:      'win64_msvc2019_64'
        modules:   'qtmultimedia'

    # ── OBS headers + import libs ─────────────────────────────
    - name: Download OBS Studio deps
      shell: pwsh
      run: |
        $OBS_VERSION = "30.1.2"
        $url = "https://github.com/obsproject/obs-studio/releases/download/$OBS_VERSION/obs-studio-$OBS_VERSION-deps-windows-x64.zip"
        Invoke-WebRequest $url -OutFile obs-deps.zip
        Expand-Archive obs-deps.zip -DestinationPath obs-deps

    - name: Download OBS headers
      shell: pwsh
      run: |
        $OBS_VERSION = "30.1.2"
        # Clone just the headers we need
        git clone --depth 1 --branch $OBS_VERSION `
          https://github.com/obsproject/obs-studio.git obs-source
      continue-on-error: false

    # ── CMake configure ───────────────────────────────────────
    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DQt6_DIR="$env:Qt6_DIR/lib/cmake/Qt6" `
          -DOBS_SOURCE_DIR="${{ github.workspace }}/obs-source"

    # ── Build ─────────────────────────────────────────────────
    - name: Build
      run: cmake --build build --config Release

    # ── Préparer le dossier de staging pour NSIS ─────────────
    - name: Stage files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging/build/Release
        New-Item -ItemType Directory -Force -Path staging/data/locale
        New-Item -ItemType Directory -Force -Path staging/assets

        Copy-Item build/Release/confidence-monitor.dll staging/build/Release/
        Copy-Item data/locale/en-US.ini                staging/data/locale/
        Copy-Item data/alert.wav                        staging/data/
        Copy-Item installer.nsi                         staging/
        Copy-Item LICENSE.txt                           staging/

        # Icône placeholder si absente
        if (-not (Test-Path assets/icon.ico)) {
          # Copier une icône OBS par défaut si disponible, sinon skip
          $mui_no_icon = '/define MUI_ICON'
          # Patch le .nsi pour désactiver l'icône custom si absente
          (Get-Content staging/installer.nsi) `
            -replace '!define MUI_ICON.*',   '' `
            -replace '!define MUI_UNICON.*', '' `
            -replace '!define MUI_HEADERIMAGE$', '' `
            -replace '!define MUI_HEADERIMAGE_BITMAP.*', '' `
            -replace '!define MUI_WELCOMEFINISHPAGE_BITMAP.*', '' |
            Set-Content staging/installer.nsi
        }

    # ── NSIS → .exe ───────────────────────────────────────────
    - name: Install NSIS
      run: choco install nsis --yes

    - name: Build installer
      shell: pwsh
      working-directory: staging
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
        Move-Item confidence-monitor-setup.exe ../

    # ── Upload artifact ───────────────────────────────────────
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: confidence-monitor-setup
        path: confidence-monitor-setup.exe
        retention-days: 30

    # ── Release (sur tag v*) ──────────────────────────────────
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: confidence-monitor-setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
